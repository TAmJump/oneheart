name: Update progress

on:
  schedule:
    - cron: "0 21 * * *"   # 06:00 JST every day
  workflow_dispatch:
    inputs:
      check_only:
        description: "Print how each reward maps and write nothing"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Check the parser against fixtures
        run: python tools/progress_parse_test.py

      - name: Read Kickstarter reward counts
        env:
          KS_PROJECT_URL: ${{ vars.KS_PROJECT_URL }}
        run: python scripts/update_progress.py ${{ inputs.check_only && '--check' || '' }}

      - name: Commit if changed
        if: ${{ !inputs.check_only }}
        run: |
          git config user.name "tamjump"
          git config user.email "tiger@tamjump.com"
          git add data/progress.json
          git diff --staged --quiet && echo "no change" && exit 0
          git commit -m "progress: daily update"
          git push
