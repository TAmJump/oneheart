name: Update progress

on:
  # No schedule. Kickstarter answers a runner with a Cloudflare challenge, so a
  # nightly run only ever fails. Numbers come in by hand: read the rewards page,
  # pass them to this workflow as rewards_json.
  workflow_dispatch:
    inputs:
      rewards_json:
        description: "Reward counts read in the browser (tools/rewards_from_page.js). Leave empty to fetch."
        type: string
        default: ""
      check_only:
        description: "Print how each reward maps and write nothing"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Check the parser against fixtures
        run: python tools/progress_parse_test.py

      - name: Read Kickstarter reward counts
        env:
          KS_PROJECT_URL: ${{ vars.KS_PROJECT_URL }}
          REWARDS_JSON: ${{ inputs.rewards_json }}
        run: python scripts/update_progress.py ${{ inputs.check_only && '--check' || '' }}

      - name: Commit if changed
        if: ${{ !inputs.check_only }}
        run: |
          git config user.name "tamjump"
          git config user.email "tiger@tamjump.com"
          git add data/progress.json
          git diff --staged --quiet && echo "no change" && exit 0
          git commit -m "progress: daily update"
          git push
